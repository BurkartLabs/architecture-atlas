server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml;
  gzip_min_length 1024;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # Pages change with every build; scripts and styles are loaded with a ?v=<content hash> and can be kept.
  location ~* \.html$ { add_header Cache-Control "no-cache"; add_header X-Content-Type-Options nosniff always; }
  location ~* \.(js|css|svg|png|woff2?)$ { add_header Cache-Control "public, max-age=86400"; add_header X-Content-Type-Options nosniff always; }
  location = /healthz { access_log off; return 200 "ok\n"; }
  location / { try_files $uri $uri/ =404; }
}
